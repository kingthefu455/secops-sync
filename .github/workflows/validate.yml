# Checks every pull request before it is merged. Needs no SecOps credentials
# and makes no API calls.
name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate code and playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The report compares the pull request with the history of its base branch
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt ruff==0.17.1

      # Integrations holds the code of the pulled integrations, not of this tool
      - name: Check Python code for syntax errors and undefined names
        run: ruff check --isolated --select E9,F63,F7,F82 --extend-exclude Integrations --output-format github .

      - name: Check the CLI starts
        run: python main.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate playbooks
        run: python main.py validate-playbooks

      # Also runs when a check above failed, since the report helps to fix it.
      # The report is shown on the summary page of the run, kept as an
      # artifact, and commented on the pull request by the next job.
      - name: Report the changes and findings of the pull request
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python validation_report.py --base "origin/$GITHUB_BASE_REF" > validation-report.md
          cat validation-report.md
          cat validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.md

  comment:
    name: Comment the report on the pull request
    needs: validate
    # Pull requests from forks get a read-only token, so they only get the
    # report on the summary page of the run
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # The only job allowed to comment. It doesn't run code of the pull request.
    permissions:
      pull-requests: write
    steps:
      - name: Download the report
        id: download
        # The report is missing if the dependencies couldn't be installed
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: validation-report

      - name: Comment the report
        if: ${{ steps.download.outcome == 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            // Finds the comment of earlier runs, so it is updated instead of
            // adding a comment on every push
            const marker = "<!-- validation-report -->";
            // GitHub comments hold at most 65536 characters
            const maxLength = 60000;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let report = fs.readFileSync("validation-report.md", "utf8");
            if (report.length > maxLength) {
              report = report.slice(0, report.lastIndexOf("\n", maxLength)) +
                `\n\n**The report is cut here.** The full report is on the [summary page of the run](${runUrl}).`;
            }
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n${report}\n\n---\n_Updated for commit ${commit} by [this run](${runUrl})._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(
              (x) => x.user?.type === "Bot" && x.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
