# Checks every pull request before it is merged. Needs no SecOps credentials
# and makes no API calls.
name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate code and playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.1

      - name: Check Python code for syntax errors and undefined names
        run: ruff check --isolated --select E9,F63,F7,F82 --output-format github .

      - name: Check the CLI starts
        run: python main.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate playbooks
        run: python main.py validate-playbooks
